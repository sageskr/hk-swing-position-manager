$schema: "https://json-schema.org/draft/2020-12/schema"
title: HK Swing Position Manager Output
type: object
required:
  - conclusion
  - market_summary
  - trend
  - support_resistance
  - position
  - holding_valuation
  - sell_ladder
  - buy_ladder
  - transaction_cost
  - net_profit
  - profit_status
  - scenarios
  - risk_warnings
  - final_recommendation
properties:
  conclusion:
    type: object
    required:
      - headline
      - action
      - recommendation
      - expected_net_result
      - investor_decision_required
      - order_submitted
    properties:
      headline: {type: string, minLength: 1}
      action: {type: string, enum: [BUY, SELL, HOLD, WAIT]}
      recommendation: {type: [object, "null"]}
      expected_net_result: {$ref: "#/$defs/net_result"}
      investor_decision_required: {type: boolean, const: true}
      order_submitted: {type: boolean, const: false}
    allOf:
      - if:
          properties:
            action: {const: BUY}
        then:
          properties:
            recommendation:
              allOf:
                - {$ref: "#/$defs/trade_recommendation"}
                - properties: {side: {const: buy}}
      - if:
          properties:
            action: {const: SELL}
        then:
          properties:
            recommendation:
              allOf:
                - {$ref: "#/$defs/trade_recommendation"}
                - properties: {side: {const: sell}}
      - if:
          properties:
            action: {enum: [HOLD, WAIT]}
        then:
          properties:
            recommendation: {type: "null"}
  metadata:
    type: object
    properties:
      generated_at: {type: string, format: date-time}
      data_source: {type: string}
      data_as_of: {type: string, format: date-time}
      data_status: {type: string, enum: [verified, user_provided, estimated, unavailable]}
  market_summary:
    type: object
    required: [ticker, market, currency, regime]
    properties:
      ticker: {type: string}
      market: {type: string, const: HK}
      currency: {type: string, const: HKD}
      regime: {type: string, enum: [bullish, sideways, bearish, transitional]}
      summary: {type: string}
      evidence: {type: array, items: {type: string}}
  trend:
    type: object
    properties:
      regime: {type: string, enum: [bullish, sideways, bearish, transitional]}
      confidence: {type: string, enum: [low, medium, high]}
      indicators: {type: array, items: {type: object}}
  support_resistance:
    type: object
    properties:
      support_zones: {type: array, items: {$ref: "#/$defs/zone"}}
      resistance_zones: {type: array, items: {$ref: "#/$defs/zone"}}
  position:
    type: object
    required: [initial_swing_shares, sold_shares, repurchased_shares, ending_swing_shares]
    properties:
      total_shares: {type: integer, minimum: 0}
      core_shares: {type: integer, minimum: 0}
      initial_swing_shares: {type: integer, minimum: 0}
      sold_shares: {type: integer, minimum: 0}
      repurchased_shares: {type: integer, minimum: 0}
      ending_swing_shares: {type: integer, minimum: 0}
      additional_shares_gained_or_lost: {type: integer}
      ending_cash: {type: number}
  holding_valuation:
    type: object
    required: [average_cost, total_cost, current_price, market_value, unrealized_profit_loss, currency, status]
    properties:
      average_cost: {type: [number, "null"], minimum: 0}
      total_cost: {type: [number, "null"], minimum: 0}
      current_price: {type: [number, "null"], minimum: 0}
      market_value: {type: [number, "null"], minimum: 0}
      unrealized_profit_loss: {type: [number, "null"]}
      currency: {type: string, const: HKD}
      status: {type: string, enum: [verified, user_provided, estimated, unavailable]}
      source: {type: [string, "null"]}
      as_of: {type: [string, "null"], format: date-time}
  sell_ladder: {type: array, minItems: 0, maxItems: 4, items: {$ref: "#/$defs/recommendation_level"}}
  buy_ladder: {type: array, minItems: 0, maxItems: 4, items: {$ref: "#/$defs/recommendation_level"}}
  transaction_cost:
    type: object
    properties:
      label: {type: string, enum: [Exact Transaction Cost, Estimated Transaction Cost, Unavailable Transaction Cost]}
      status: {type: string, enum: [verified, user_provided, estimated, unavailable]}
      total: {type: number, minimum: 0}
      components: {type: object}
      slippage: {type: number, minimum: 0}
  net_profit:
    type: object
    properties:
      gross_profit: {type: number}
      transaction_cost: {type: number, minimum: 0}
      net_profit: {type: number}
      cost_ratio: {type: [number, "null"], minimum: 0}
      minimum_effective_spread: {type: number, minimum: 0}
      alert_level: {type: string, enum: [GREEN, YELLOW, RED, NOT_MEANINGFUL]}
  share_growth:
    type: object
    properties:
      initial_shares: {type: integer, minimum: 0}
      ending_shares: {type: integer, minimum: 0}
      gained_or_lost: {type: integer}
  profit_status:
    type: object
    required:
      - initial_swing_shares
      - current_swing_shares
      - cumulative_net_profit
      - profit_reserve
      - profit_generated_shares
      - core_shares
      - total_shares
    properties:
      initial_swing_shares: {type: integer, minimum: 0}
      current_swing_shares: {type: integer, minimum: 0}
      cumulative_net_profit: {type: number}
      profit_reserve: {type: number, minimum: 0}
      profit_generated_shares: {type: integer, minimum: 0}
      core_shares: {type: integer, minimum: 0}
      total_shares: {type: integer, minimum: 0}
  profit_ledger:
    type: object
    properties:
      cumulative_net_profit: {type: number}
      profit_reserve: {type: number, minimum: 0}
      profit_generated_shares: {type: integer, minimum: 0}
      transactions: {type: array, items: {type: object}}
  scenarios:
    type: object
    required: [bull, base, bear]
    properties:
      bull: {$ref: "#/$defs/scenario"}
      base: {$ref: "#/$defs/scenario"}
      bear: {$ref: "#/$defs/scenario"}
  risk_warnings: {type: array, items: {type: string}}
  final_recommendation:
    type: object
    required: [action, investor_decision_required]
    properties:
      action: {type: string, enum: [WAIT, BUY, SELL, HOLD]}
      summary: {type: string}
      investor_decision_required: {type: boolean, const: true}
      order_submitted: {type: boolean, const: false}
$defs:
  zone:
    type: object
    required: [lower, upper, strength, confidence, sources]
    properties:
      lower: {type: number}
      upper: {type: number}
      strength: {type: string, enum: [weak, medium, strong]}
      confidence: {type: string, enum: [low, medium, high]}
      sources: {type: array, items: {type: string}}
  trade_recommendation:
    type: object
    required: [status, shares, gross_value, estimated_transaction_cost, currency]
    properties:
      side: {type: string, enum: [buy, sell]}
      status: {type: string, const: recommended}
      shares: {type: integer, minimum: 1}
      gross_value: {type: [number, "null"], minimum: 0}
      estimated_transaction_cost: {type: [number, "null"], minimum: 0}
      currency: {type: string, const: HKD}
      trigger: {type: string}
      note: {type: string}
  net_result:
    type: object
    required: [value, currency, status]
    properties:
      value: {type: [number, "null"]}
      currency: {type: string, const: HKD}
      status: {type: string, enum: [estimated, actual, unavailable]}
      note: {type: string}
  recommendation_level:
    type: object
    required: [price, shares, status]
    properties:
      price: {type: number, exclusiveMinimum: 0}
      shares: {type: integer, minimum: 0}
      trigger: {type: string}
      estimated_cost: {type: number, minimum: 0}
      status: {type: string, enum: [recommended, blocked, unavailable]}
      investor_decision_required: {type: boolean, const: true}
  scenario:
    type: object
    required: [trigger, expected_market_behavior, recommended_action, risk]
    properties:
      trigger: {type: string}
      expected_market_behavior: {type: string}
      recommended_action: {type: string}
      risk: {type: string}
