$schema: "https://json-schema.org/draft/2020-12/schema"
title: HK Swing Position Manager State
type: object
required:
  - ticker
  - total_shares
  - core_shares
  - initial_swing_shares
  - current_swing_shares
  - profit_generated_shares
  - cumulative_net_profit
  - profit_reserve
  - transactions
  - profit_reserve_adjustments
  - audit_trail
  - average_cost
  - total_cost
  - current_price
  - market_value
  - unrealized_profit_loss
  - cash_balance
  - realized_profit_loss
  - cash_ledger
properties:
  ticker: {type: string, minLength: 1}
  total_shares: {type: integer, minimum: 0}
  core_shares: {type: integer, minimum: 0}
  initial_swing_shares: {type: integer, minimum: 0}
  current_swing_shares: {type: integer, minimum: 0}
  minimum_core_shares: {type: integer, minimum: 0}
  profit_generated_shares: {type: integer, minimum: 0}
  cumulative_net_profit: {type: string}
  profit_reserve: {type: string, pattern: "^(0|[0-9]+(\\.[0-9]+)?)$"}
  opening_profit_reserve: {type: string}
  unallocated_shares: {type: integer, minimum: 0}
  transactions: {type: array, items: {type: object}}
  profit_reserve_adjustments: {type: array, items: {$ref: "#/$defs/reserve_adjustment"}}
  audit_trail: {type: array, items: {type: object}}
  last_updated: {type: [string, "null"], format: date-time}
  average_cost: {type: [string, "null"]}
  total_cost: {type: [string, "null"]}
  current_price: {type: [string, "null"]}
  market_value: {type: [string, "null"]}
  unrealized_profit_loss: {type: [string, "null"]}
  valuation_as_of: {type: [string, "null"], format: date-time}
  valuation_source: {type: [string, "null"]}
  valuation_status: {type: string, enum: [verified, user_provided, estimated, unavailable]}
  cash_balance: {type: [string, "null"]}
  realized_profit_loss: {type: [string, "null"]}
  cash_ledger: {type: array, items: {$ref: "#/$defs/cash_event"}}
$defs:
  cash_event:
    type: object
    required: [id, event_type, side, status, ticker, date, shares, price, gross_amount, transaction_cost, slippage_cost, net_cash_change]
    properties:
      id: {type: string, minLength: 1}
      event_type: {type: string, enum: [sale, buy, repurchase]}
      side: {type: string, enum: [sell, buy]}
      status: {type: string, const: investor_reported}
      source: {type: string, minLength: 1}
      ticker: {type: string, minLength: 1}
      date: {type: string, format: date}
      shares: {type: integer, minimum: 1}
      price: {type: string}
      gross_amount: {type: string}
      transaction_cost: {type: string}
      slippage_cost: {type: string}
      net_cash_change: {type: string}
      cost_basis: {type: [string, "null"]}
      cost_basis_added: {type: [string, "null"]}
      realized_profit_loss: {type: [string, "null"]}
  reserve_adjustment:
    type: object
    required: [date, previous_value, adjusted_value, difference, reason, source]
    properties:
      date: {type: string, format: date-time}
      previous_value: {type: string}
      adjusted_value: {type: string}
      difference: {type: string}
      reason: {type: string, minLength: 1}
      source: {type: string, const: manual}
      after_transaction_id: {type: [string, "null"]}
