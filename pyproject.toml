[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-swing-position-manager"
version = "0.1.0"
description = "Decision-support skill for Hong Kong stock core and swing positions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "market_data",
  "trend",
  "support_resistance",
  "position",
  "ladder",
  "transaction_cost",
  "risk",
  "report",
  "state",
  "profit_ledger",
]
